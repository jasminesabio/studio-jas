<!doctype html><html><head><meta charset=utf8><title>Recipe Box — Studio Jas</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/apple-touch-icon.png"></head><body>
<title>Recipe Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: a cheerful cooking-game kitchen. Gingham header band, white cartoon-outlined cards with chunky offset shadows, sticker badges. Single light theme by choice. */
:root{
  color-scheme:light;
  --bg:#fff6dc; --paper:#ffffff; --ink:#4a2c1d; --muted:#9a7562; --line:#f1dcc0;
  --accent:#ff6b57; --accent-ink:#ffffff; --mustard:#ffc93c; --mustard-soft:#fff0bf;
  --mint:#3cc4a0; --sky:#6ec6ff; --pink:#ff9ec4;
  --good:#1f9a78; --good-soft:#d4f5ea; --mid:#b07a00; --mid-soft:#fff0bf; --bad:#e2483a; --bad-soft:#ffe1dc;
  --outline:2.5px solid var(--ink);
  --pop:0 4px 0 var(--ink);
  --shadow:var(--pop);
  --f-display:"Fredoka","Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,sans-serif;
  --f-mono:"Fredoka",ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;font-weight:600;
  background-image:radial-gradient(circle,#ffe4a6 2px,transparent 2.5px);background-size:26px 26px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--accent);font-weight:800}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;
  padding:22px max(16px,env(safe-area-inset-right,0px)) 26px max(16px,env(safe-area-inset-left,0px));
  background-color:#fff;
  background-image:linear-gradient(90deg,rgba(255,107,87,.45) 50%,transparent 50%),linear-gradient(rgba(255,107,87,.45) 50%,transparent 50%);
  background-size:28px 28px;border-bottom:var(--outline);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
  background:radial-gradient(circle at 12px 0,var(--ink) 9px,transparent 9.5px) 0 0/24px 12px repeat-x;opacity:.0}
.brand{background:var(--paper);border:var(--outline);border-radius:22px;padding:10px 20px 12px;box-shadow:var(--pop);transform:rotate(-1.5deg)}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(2rem,6vw,2.9rem);line-height:1;margin:0;color:var(--accent);letter-spacing:.01em;
  text-shadow:2px 2px 0 var(--mustard)}
.brand h1 .star{color:var(--mustard);text-shadow:none;font-size:.6em;vertical-align:.5em;margin-left:4px;display:inline-block}
.brand p{margin:4px 0 0;color:var(--muted);font-size:.92rem;font-weight:700}

.btn{display:inline-flex;align-items:center;gap:6px;border:var(--outline);background:var(--paper);border-radius:999px;padding:8px 16px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:.95rem;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--mustard-soft);box-shadow:none;transform:none}
.btn.danger{border-color:var(--bad);color:var(--bad);box-shadow:0 3px 0 var(--bad)}
.btn.ghost.danger{box-shadow:none}
.btn.sm{padding:5px 12px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:default;transform:none}
#addBtn{font-size:1.05rem;padding:10px 20px;background:var(--mint);color:#fff;transform:rotate(1deg)}

nav.tabs{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}
.tab{border:var(--outline);background:var(--paper);padding:7px 16px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1rem;color:var(--ink);display:inline-flex;gap:8px;align-items:center;box-shadow:0 3px 0 var(--ink)}
.tab .n{font-size:.8rem;background:var(--mustard-soft);color:var(--ink);border-radius:999px;padding:0 8px;border:2px solid var(--ink);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--mustard);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tab[aria-selected="true"] .n{background:#fff}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.search{flex:1 1 220px;min-width:0;border:var(--outline);background:var(--paper);border-radius:999px;padding:9px 16px;font-weight:700}
.toolbar select{border:var(--outline);background:var(--paper);border-radius:999px;padding:9px 14px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 18px}
.chip{border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:2px 12px;font-size:.84rem;cursor:pointer;font-weight:800}
.chip[aria-pressed="true"]{background:var(--pink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;text-align:left;background:var(--paper);border:var(--outline);border-radius:20px;padding:16px 18px;cursor:pointer;box-shadow:var(--pop);display:flex;flex-direction:column;gap:8px;min-width:0;transition:transform .12s}
.card:hover{transform:translateY(-3px) rotate(-.6deg)}
.card:nth-child(4n+2):hover{transform:translateY(-3px) rotate(.6deg)}
.card h3{font-family:var(--f-display);font-weight:600;font-size:1.22rem;line-height:1.2;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.snip{font-size:.93rem;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0;font-weight:600}
.snip em{color:var(--accent);font-style:normal;font-weight:800}
.pill{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:.8rem;border-radius:999px;padding:1px 10px;border:2px solid currentColor;transform:rotate(-2deg)}
.v-again{background:var(--good-soft);color:var(--good)}
.v-again::before{content:"★ "}
.v-okay{background:var(--mid-soft);color:var(--mid)}
.v-no{background:var(--bad-soft);color:var(--bad)}
.v-try{background:#e3f4ff;color:#1677b8}
.ex{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;border:2px dashed var(--muted);color:var(--muted);border-radius:6px;padding:0 5px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:.76rem;color:var(--ink);background:var(--mustard-soft);border-radius:999px;padding:0 8px;font-family:var(--f-body);font-weight:700}

.empty{background:var(--paper);border:2.5px dashed var(--ink);border-radius:20px;padding:36px 20px;text-align:center;color:var(--muted)}
.empty h3{font-family:var(--f-display);color:var(--accent);margin:0 0 6px;font-size:1.4rem;font-weight:600}

/* week */
.weekhead{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.weekhead h2{font-family:var(--f-display);font-size:1.5rem;font-weight:600;margin:0 8px 0 0;color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--paper);border:var(--outline);border-radius:16px;padding:10px;min-height:150px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 3px 0 var(--ink)}
.day.today{background:var(--mustard-soft)}
.day h4{margin:0;font-family:var(--f-display);font-size:.9rem;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}
.day.today h4 span:last-child{background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
.plan{border:2px solid var(--ink);background:#e3f4ff;border-radius:12px;padding:6px 9px;font-size:.88rem;font-weight:800;cursor:pointer;text-align:left;line-height:1.25;overflow-wrap:anywhere}
.plan:nth-of-type(3n+2){background:var(--good-soft)} .plan:nth-of-type(3n){background:#ffe6f0}
.plan:hover{transform:rotate(-1deg)}
.addday{margin-top:auto;border:2px dashed var(--muted);background:none;border-radius:12px;padding:4px;font-size:.84rem;color:var(--muted);cursor:pointer;font-weight:800}
.addday:hover{border-color:var(--ink);color:var(--ink);background:var(--mustard-soft)}
@media (max-width:820px){.week{grid-template-columns:1fr}.day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.day h4{width:100%}.addday{margin-top:0}}
.subhead{font-family:var(--f-display);font-size:1.25rem;font-weight:600;margin:30px 0 12px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(74,44,29,.35);z-index:20;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 40px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--paper);border:var(--outline);border-radius:26px;width:100%;max-width:780px;box-shadow:0 6px 0 var(--ink);position:relative;min-width:0;overflow:hidden}
.sheet-head{padding:20px 22px 16px;border-bottom:var(--outline);display:flex;gap:12px;align-items:flex-start;background:var(--mustard)}
.sheet-head h2{font-family:var(--f-display);font-weight:600;font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.1;margin:0;text-wrap:balance;flex:1;min-width:0}
.sheet-head .meta{color:var(--ink)}
.sheet-head .btn.ghost:hover{background:#fff}
.sheet-body{padding:20px 22px 26px;display:grid;gap:22px}
.src{font-size:.9rem;color:var(--ink);margin-top:6px;overflow-wrap:anywhere}
.mynotes{background:#ffe6f0;border:2px solid var(--ink);border-radius:16px;padding:14px 16px;display:grid;gap:8px;transform:rotate(-.4deg)}
.mynotes h3,.sec h3{font-family:var(--f-display);font-size:1.15rem;margin:0;color:var(--accent);font-weight:600;letter-spacing:.01em}
.mynotes p{margin:0;white-space:pre-wrap}
.mynotes b{font-family:var(--f-display);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:26px}
@media (max-width:680px){.cols{grid-template-columns:1fr}}
.ing{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px}
.ing li label{display:flex;gap:10px;align-items:flex-start;padding:5px 6px;border-radius:10px;cursor:pointer}
.ing li label:hover{background:var(--mustard-soft)}
.ing input{appearance:none;margin-top:3px;width:20px;height:20px;flex:none;border:2.5px solid var(--ink);border-radius:50%;background:#fff;cursor:pointer;display:grid;place-items:center}
.ing input:checked{background:var(--mint)}
.ing input:checked::after{content:"✓";color:#fff;font-size:12px;font-weight:900;line-height:1}
.ing input:checked+span{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.ing .h{font-weight:600;margin-top:10px;padding-left:6px;font-family:var(--f-display);color:var(--ink)}
.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;cursor:pointer;border-radius:14px;padding:6px;align-items:start}
.steps li:hover{background:var(--mustard-soft)}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:600;background:var(--accent);color:#fff;border:2.5px solid var(--ink);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:1rem;box-shadow:0 2px 0 var(--ink)}
.steps li:nth-child(3n+2)::before{background:var(--sky)} .steps li:nth-child(3n)::before{background:var(--mint)}
.steps li.done{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.steps li.done::before{content:"✓";background:var(--line);color:var(--ink)}
.steps .h{grid-column:1/-1;font-weight:600;font-family:var(--f-display);text-decoration:none}
.steps .h::before{display:none}
.log{display:grid;gap:8px;margin-top:8px}
.log-item{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;background:var(--bg);border-radius:12px;padding:8px 12px}
.log-item time{font-family:var(--f-display);font-size:.86rem;color:var(--accent);white-space:nowrap;font-weight:600}
.log-item p{margin:0;font-size:.95rem;white-space:pre-wrap}
.log-item .x{grid-column:2;justify-self:start}
.actions{display:flex;flex-wrap:wrap;gap:10px}
#logBtn{background:var(--mint)}
.inline-form{display:grid;gap:8px;background:var(--mustard-soft);border:2px solid var(--ink);padding:14px;border-radius:16px;margin-top:8px}
.inline-form .row{display:flex;gap:8px;flex-wrap:wrap}

/* editor */
form.ed{display:grid;gap:14px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-family:var(--f-display);font-weight:600;font-size:1rem}
.f small{color:var(--muted);font-size:.82rem}
.f input,.f textarea,.f select{border:2.5px solid var(--ink);background:#fff;border-radius:12px;padding:8px 12px;width:100%;min-width:0;font-weight:600}
.f textarea{resize:vertical;min-height:90px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.two{grid-template-columns:1fr}}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:5px 13px;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--mustard);box-shadow:inset 0 2px 0 rgba(74,44,29,.25)}
.paste{background:#e3f4ff;border:2.5px dashed var(--ink);border-radius:16px;padding:14px;display:grid;gap:8px}
.paste p{margin:0;font-size:.9rem;color:var(--ink)}
.status{font-size:.9rem;color:var(--muted);min-height:1.2em}
.confirm{background:var(--bad-soft);border:2px solid var(--bad);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-3deg);background:var(--mustard);color:var(--ink);border:var(--outline);box-shadow:var(--pop);padding:8px 22px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;z-index:40}
.banner{background:var(--bad-soft);color:var(--bad);border:2px solid var(--bad);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .25s cubic-bezier(.3,1.5,.6,1)}@keyframes up{from{transform:translateY(16px) scale(.97)}to{transform:none}}
  .toast:not([hidden]){animation:pop .35s cubic-bezier(.3,1.8,.5,1)}@keyframes pop{from{transform:translateX(-50%) rotate(-3deg) scale(.4)}to{transform:translateX(-50%) rotate(-3deg) scale(1)}}
  .brand h1 .star{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{transform:rotate(20deg) scale(1.2)}}
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Recipe Box<span class="star" aria-hidden="true">★</span></h1>
    </div>
    <a class="btn sm" href="/" style="text-decoration:none;color:var(--ink)">← Studio Jas</a>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-cooked" data-view="cooked" aria-selected="true">Cooked <span class="n" id="n-cooked">0</span></button>
    <button class="tab" role="tab" id="tab-queue" data-view="queue" aria-selected="false">Want to try <span class="n" id="n-queue">0</span></button>
    
  </nav>

  <div id="banner" class="banner" hidden></div>
  <main id="main"></main>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const VERDICT = {again:["Make again","v-again"], okay:["It was fine","v-okay"], no:["Not again","v-no"]};

  let db = null, col = null, sample = null, canWrite = true;
  let recipes = [];
  let loaded = false;
  const ui = { view: "cooked", q: "", tag: "", sort: "recent", weekOffset: 0, openId: null };
  try { const v = localStorage.getItem("rb.view"); if (v) ui.view = v; } catch(e){}
  if (["cooked","queue","week"].includes(location.hash.slice(1))) ui.view = location.hash.slice(1);

  // ---------- dates ----------
  const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
  const today = () => iso(new Date());
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const fmt = s => s ? parse(s).toLocaleDateString(undefined,{month:"short",day:"numeric",year: parse(s).getFullYear()===new Date().getFullYear()?undefined:"numeric"}) : "";
  const weekStart = off => { const d = new Date(); d.setHours(0,0,0,0); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow+off*7); return d; };

  // ---------- helpers ----------
  const lastCook = r => (r.cooks||[]).map(c=>c.date).filter(Boolean).sort().pop() || "";
  const domain = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } };
  const lines = t => String(t||"").split(/\n/).map(s=>s.trim()).filter(Boolean);
  const isHead = l => /^#\s*/.test(l) || (/:$/.test(l) && l.length < 40);
  const headText = l => l.replace(/^#\s*/,"").replace(/:$/,"");

  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
  function banner(msg){ const b=$("#banner"); b.textContent=msg||""; b.hidden=!msg; }

  // ---------- render ----------
  function counts(){
    $("#n-cooked").textContent = recipes.filter(r=>r.status!=="queue").length;
    $("#n-queue").textContent = recipes.filter(r=>r.status==="queue").length;
  }
  function setView(v){
    ui.view=v; try{localStorage.setItem("rb.view",v);}catch(e){}
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", String(t.dataset.view===v)));
    render();
  }
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>setView(t.dataset.view)));
  

  function filtered(list){
    const q = ui.q.toLowerCase();
    return list.filter(r => (!ui.tag || (r.tags||[]).includes(ui.tag)) &&
      (!q || [r.title,r.ingredients,r.changes,r.nextTime,(r.tags||[]).join(" "),(r.cooks||[]).map(c=>c.note).join(" ")].join(" ").toLowerCase().includes(q)));
  }

  function card(r){
    const lc = lastCook(r), n = (r.cooks||[]).length;
    const v = r.status==="queue" ? ["Want to try","v-try"] : VERDICT[r.verdict];
    const note = r.nextTime ? `<em>Next time:</em> ${esc(r.nextTime)}` : r.changes ? `<em>Changes:</em> ${esc(r.changes)}` : (r.cooks||[]).slice(-1)[0]?.note ? esc(r.cooks.slice(-1)[0].note) : r.why ? esc(r.why) : "";
    const src = domain(r.url) || r.sourceNote || "";
    return `<button class="card" type="button" data-id="${esc(r.id)}">
      <h3>${esc(r.title||"Untitled")}</h3>
      <div class="meta">${v?`<span class="pill ${v[1]}">${v[0]}</span>`:""}${r.example?'<span class="ex">Example</span>':""}
        ${r.status!=="queue" && lc ? `<span>Last ${fmt(lc)}</span><span>${n}× cooked</span>`:""}
        </div>
      ${note?`<p class="snip">${note}</p>`:""}
      <div class="meta">${src?`<span>${esc(src)}</span>`:""}${(r.tags||[]).length?`<span class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</span>`:""}</div>
    </button>`;
  }

  function render(){
    counts();
    const m = $("#main");
    if (ui.view === "week") return renderWeek(m);
    const queue = ui.view === "queue";
    let list = recipes.filter(r => queue ? r.status==="queue" : r.status!=="queue");
    const allTags = [...new Set(list.flatMap(r=>r.tags||[]))].sort();
    list = filtered(list);
    if (ui.sort==="az") list.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
    else if (ui.sort==="most") list.sort((a,b)=>(b.cooks||[]).length-(a.cooks||[]).length);
    else list.sort((a,b)=> queue ? (b.createdAt||"").localeCompare(a.createdAt||"") : lastCook(b).localeCompare(lastCook(a)));

    const total = recipes.filter(r => queue ? r.status==="queue" : r.status!=="queue").length;
    m.innerHTML = `
      <div class="toolbar">
        <input class="search" id="q" type="search" placeholder="Search titles, ingredients, notes" value="${esc(ui.q)}" aria-label="Search">
        ${queue?"":`<select id="sort" aria-label="Sort"><option value="recent">Recently cooked</option><option value="most">Most cooked</option><option value="az">A to Z</option></select>`}
      </div>
      
      ${!loaded ? `<div class="empty"><h3>Opening your recipe box…</h3></div>` :
        total===0 ? (queue
          ? `<div class="empty"><h3>Nothing queued yet</h3><p>Recipes you want to try will show up here.</p></div>`
          : `<div class="empty"><h3>Your cooked recipes will show up here</h3><p>Each card shows when you last made it, what you thought, and what to change next time.</p></div>`)
        : list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<div class="empty"><h3>No matches</h3><p>Try a different search or tag.</p></div>`}`;
    const q=$("#q"); q.addEventListener("input",e=>{ui.q=e.target.value; const pos=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos);});
    const s=$("#sort"); if(s){ s.value=ui.sort; s.addEventListener("change",e=>{ui.sort=e.target.value;render();}); }
    m.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>{ui.tag = ui.tag===c.dataset.tag?"":c.dataset.tag; render();}));
    m.querySelectorAll(".card").forEach(c=>c.addEventListener("click",()=>openSheet(c.dataset.id)));
    m.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>openEditor(null,{status:b.dataset.add==="queue"?"queue":"cooked"})));
  }

  function renderWeek(m){
    const start = weekStart(ui.weekOffset);
    const days = [...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
    const label = ui.weekOffset===0?"This week":ui.weekOffset===1?"Next week":ui.weekOffset===-1?"Last week":`Week of ${days[0].toLocaleDateString(undefined,{month:"short",day:"numeric"})}`;
    const unplanned = recipes.filter(r=>r.status==="queue" && !r.plannedFor);
    m.innerHTML = `
      <div class="weekhead"><h2>${label}</h2>
        <button class="btn sm" id="wprev" type="button" aria-label="Previous week">←</button>
        <button class="btn sm" id="wnow" type="button">Today</button>
        <button class="btn sm" id="wnext" type="button" aria-label="Next week">→</button>
        <span class="meta">${days[0].toLocaleDateString(undefined,{month:"short",day:"numeric"})} to ${days[6].toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span></div>
      <div class="week">${days.map(d=>{ const k=iso(d); const items=recipes.filter(r=>r.plannedFor===k);
        return `<div class="day ${k===today()?"today":""}"><h4><span>${d.toLocaleDateString(undefined,{weekday:"short"})}</span><span>${d.getDate()}</span></h4>
          ${items.map(r=>`<button class="plan" type="button" data-id="${esc(r.id)}">${esc(r.title)}</button>`).join("")}
          <button class="addday" type="button" data-day="${k}">+ plan</button></div>`;}).join("")}</div>
      <h3 class="subhead">Queued, not planned yet</h3>
      ${unplanned.length?`<div class="grid">${unplanned.map(card).join("")}</div>`:`<div class="empty"><p>Everything in your queue has a day. Add more under Want to try.</p></div>`}`;
    $("#wprev").onclick=()=>{ui.weekOffset--;render();}; $("#wnext").onclick=()=>{ui.weekOffset++;render();}; $("#wnow").onclick=()=>{ui.weekOffset=0;render();};
    m.querySelectorAll(".plan,.card").forEach(c=>c.addEventListener("click",()=>openSheet(c.dataset.id)));
    m.querySelectorAll(".addday").forEach(b=>b.addEventListener("click",()=>pickForDay(b.dataset.day)));
  }

  function pickForDay(day){
    const opts = [...recipes].sort((a,b)=> (a.status==="queue"?0:1)-(b.status==="queue"?0:1) || (a.title||"").localeCompare(b.title||""));
    showOverlay(`<div class="sheet"><div class="sheet-head"><h2>Plan for ${parse(day).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})}</h2><button class="btn ghost" data-close type="button" aria-label="Close">✕</button></div>
      <div class="sheet-body"><input class="search" id="pq" placeholder="Find a recipe" aria-label="Find a recipe">
      <div id="plist" style="display:grid;gap:6px">${opts.map(r=>`<button class="plan" type="button" data-id="${esc(r.id)}">${esc(r.title)} <span class="meta" style="display:inline">${r.status==="queue"?"· want to try":"· cooked "+(r.cooks||[]).length+"×"}</span></button>`).join("") || "<p>Add a recipe first.</p>"}</div></div></div>`);
    $("#pq").addEventListener("input",e=>{const q=e.target.value.toLowerCase(); document.querySelectorAll("#plist .plan").forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));});
    document.querySelectorAll("#plist .plan").forEach(b=>b.addEventListener("click",async()=>{ await save(b.dataset.id,{plannedFor:day}); closeOverlay(); toast("On the menu!"); }));
  }

  // ---------- overlay ----------
  let wakeLock=null;
  function showOverlay(html){ const o=$("#overlay"); o.innerHTML=html; o.hidden=false; document.body.style.overflow="hidden"; o.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",closeOverlay)); o.scrollTop=0; }
  function closeOverlay(){ $("#overlay").hidden=true; $("#overlay").innerHTML=""; document.body.style.overflow=""; ui.openId=null; if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;} }
  $("#overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeOverlay(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#overlay").hidden) closeOverlay(); });

  function ingHTML(r){
    let i=0; return lines(r.ingredients).map(l=> isHead(l) ? `<li class="h">${esc(headText(l))}</li>` : `<li><label><input type="checkbox" id="ing-${i++}"><span>${esc(l.replace(/^[-*•]\s*/,""))}</span></label></li>`).join("");
  }
  function stepsHTML(r){
    return lines(r.steps).map(l=> isHead(l) ? `<li class="h">${esc(headText(l))}</li>` : `<li>${esc(l.replace(/^(\d+[.)]|[-*•])\s*/,""))}</li>`).join("");
  }

  function openSheet(id){
    const r = recipes.find(x=>x.id===id); if(!r) return;
    ui.openId=id;
    const v = r.status==="queue" ? ["Want to try","v-try"] : VERDICT[r.verdict];
    const cooks = [...(r.cooks||[])].map((c,i)=>({...c,i})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    const hasNotes = r.changes || r.nextTime || r.why;
    showOverlay(`<article class="sheet">
      <div class="sheet-head"><div style="flex:1;min-width:0">
        <div class="meta" style="margin-bottom:6px">${v?`<span class="pill ${v[1]}">${v[0]}</span>`:""}${r.example?'<span class="ex">Example</span>':""}${r.time?`<span>${esc(r.time)}</span>`:""}${r.servings?`<span>Serves ${esc(r.servings)}</span>`:""}</div>
        <h2>${esc(r.title)}</h2>
        ${r.url||r.sourceNote?`<div class="src">${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(domain(r.url)||r.url)} ↗</a>`:""}${r.url&&r.sourceNote?" · ":""}${esc(r.sourceNote||"")}</div>`:""}
      </div><button class="btn ghost" data-close type="button" aria-label="Close">✕</button></div>
      <div class="sheet-body">
        ${hasNotes?`<div class="mynotes"><h3>My notes</h3>
          ${r.why?`<p><b>Why I want to make it:</b> ${esc(r.why)}</p>`:""}
          ${r.changes?`<p><b>What I change:</b> ${esc(r.changes)}</p>`:""}
          ${r.nextTime?`<p><b>Next time:</b> ${esc(r.nextTime)}</p>`:""}</div>`:""}
        <div class="cols">
          <section class="sec"><h3>Ingredients</h3>${r.ingredients?`<ul class="ing">${ingHTML(r)}</ul>`:`<p class="status">No ingredients yet. Edit to add them.</p>`}</section>
          <section class="sec"><h3>Method</h3>${r.steps?`<ol class="steps">${stepsHTML(r)}</ol>`:`<p class="status">No steps yet. Edit to add them.</p>`}</section>
        </div>
        <section class="sec"><h3>Cook log</h3>
          <div class="log">${cooks.length?cooks.map(c=>`<div class="log-item"><time>${fmt(c.date)||"No date"}</time><p>${esc(c.note||"No notes")}</p></div>`).join(""):`<p class="status">Not cooked yet.</p>`}</div>
          <div id="logform"></div>
        </section>
        
      </div></article>`);
    document.querySelectorAll(".steps li:not(.h)").forEach(li=>li.addEventListener("click",()=>li.classList.toggle("done")));
    return;
    $("#editBtn").onclick=()=>openEditor(r);
    $("#logBtn").onclick=()=>logForm(r);
    $("#planBtn").onclick=()=>planForm(r);
    $("#wakeBtn").onclick=async e=>{ try{ wakeLock = await navigator.wakeLock.request("screen"); e.target.textContent="Screen stays on"; e.target.disabled=true; }catch(err){ e.target.textContent="Not available here"; e.target.disabled=true; } };
    $("#delBtn").onclick=()=>{ $("#sheetConfirm").innerHTML=`<div class="confirm">Delete “${esc(r.title)}” and its cook log? <button class="btn danger sm" id="delYes" type="button">Delete</button><button class="btn sm" id="delNo" type="button">Keep it</button></div>`;
      $("#delNo").onclick=()=>$("#sheetConfirm").innerHTML="";
      $("#delYes").onclick=async()=>{ try{ await col.doc(r.id).delete(); closeOverlay(); toast("Deleted"); }catch(e){ toast("Couldn't delete. Try again."); } }; };
    document.querySelectorAll("[data-rmcook]").forEach(b=>b.addEventListener("click",async()=>{ const c=[...(r.cooks||[])]; c.splice(Number(b.dataset.rmcook),1); await save(r.id,{cooks:c}); openSheet(r.id); }));
  }

  function logForm(r){
    $("#logform").innerHTML=`<form class="inline-form" id="lf">
      <div class="row"><div class="f" style="flex:0 1 180px"><label for="lf-date">Date</label><input type="date" id="lf-date" value="${today()}" required></div>
      ${r.status==="queue"||!r.verdict?`<div class="f"><label>Verdict</label><div class="seg" id="lf-v">${Object.entries(VERDICT).map(([k,[t]])=>`<button type="button" data-v="${k}" aria-pressed="${r.verdict===k}">${t}</button>`).join("")}</div></div>`:""}</div>
      <div class="f"><label for="lf-note">How did it go?</label><textarea id="lf-note" rows="3" placeholder="Swaps, timing, what to change"></textarea></div>
      <div class="row"><button class="btn primary" type="submit">Save to log</button><button class="btn ghost" type="button" id="lf-x">Cancel</button></div></form>`;
    let verdict = r.verdict||"";
    document.querySelectorAll("#lf-v button").forEach(b=>b.onclick=()=>{verdict=b.dataset.v; document.querySelectorAll("#lf-v button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));});
    $("#lf-x").onclick=()=>$("#logform").innerHTML="";
    $("#lf-note").focus();
    $("#lf").onsubmit=async e=>{ e.preventDefault();
      const cooks=[...(r.cooks||[]),{date:$("#lf-date").value,note:$("#lf-note").value.trim()}];
      const patch={cooks,status:"cooked",verdict};
      if(r.plannedFor && r.plannedFor<=$("#lf-date").value) patch.plannedFor="";
      await save(r.id,patch); toast("Nice cooking!"); openSheet(r.id); };
  }

  function planForm(r){
    const start=weekStart(0);
    const opts=[...Array(14)].map((_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i);return d;});
    $("#logform").innerHTML=`<div class="inline-form"><div class="f"><label>Pick a day</label>
      <div class="seg" id="pf">${opts.map(d=>`<button type="button" data-d="${iso(d)}" aria-pressed="${r.plannedFor===iso(d)}">${d.toLocaleDateString(undefined,{weekday:"short",day:"numeric"})}</button>`).join("")}</div></div>
      <div class="row"><input type="date" id="pf-date" value="${r.plannedFor||""}" aria-label="Other date" style="border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--paper)">
      <button class="btn sm" type="button" id="pf-set">Set date</button>${r.plannedFor?`<button class="btn ghost sm" type="button" id="pf-clear">Unplan</button>`:""}</div></div>`;
    const set=async d=>{ await save(r.id,{plannedFor:d}); toast(d?"On the menu!":"Unplanned"); openSheet(r.id); };
    document.querySelectorAll("#pf button").forEach(b=>b.onclick=()=>set(b.dataset.d));
    $("#pf-set").onclick=()=>{ if($("#pf-date").value) set($("#pf-date").value); };
    if($("#pf-clear")) $("#pf-clear").onclick=()=>set("");
  }

  // ---------- editor ----------
  function openEditor(r, defaults={}){
    const isNew=!r; r = r || {status:"cooked",tags:[],cooks:[],...defaults};
    let status=r.status==="queue"?"queue":"cooked", verdict=r.verdict||"";
    showOverlay(`<div class="sheet"><div class="sheet-head"><h2>${isNew?"Add a recipe":"Edit recipe"}</h2><button class="btn ghost" data-close type="button" aria-label="Close">✕</button></div>
      <div class="sheet-body"><form class="ed" id="ed">
        <div class="f"><label>Have you made it?</label><div class="seg" id="ed-status">
          <button type="button" data-s="cooked" aria-pressed="${status==="cooked"}">Yes, I've cooked it</button>
          <button type="button" data-s="queue" aria-pressed="${status==="queue"}">Not yet, want to try</button></div></div>
        ${sample?`<div class="paste"><label for="ed-paste"><b>Paste a recipe page</b></label>
          <p>Copy the whole page (or just the recipe part) and paste it here. Claude pulls out the title, ingredients and steps and skips the rest.</p>
          <textarea id="ed-paste" rows="4" style="border:1.5px solid var(--line);border-radius:8px;padding:8px;background:var(--paper)"></textarea>
          <div class="row" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" type="button" id="ed-extract">Pull out the recipe</button><span class="status" id="ed-xs"></span></div></div>`:""}
        <div class="f"><label for="ed-title">Name</label><input id="ed-title" required value="${esc(r.title)}" placeholder="Chicken tinga"></div>
        <div class="two">
          <div class="f"><label for="ed-url">Link</label><input id="ed-url" type="url" value="${esc(r.url)}" placeholder="https://"></div>
          <div class="f"><label for="ed-src">Source if no link</label><input id="ed-src" value="${esc(r.sourceNote)}" placeholder="Dan's mom, cookbook p. 42"></div>
        </div>
        <div class="two">
          <div class="f"><label for="ed-time">Time</label><input id="ed-time" value="${esc(r.time)}" placeholder="45 min"></div>
          <div class="f"><label for="ed-serv">Serves</label><input id="ed-serv" value="${esc(r.servings)}" placeholder="4"></div>
        </div>
        <div class="f"><label for="ed-tags">Tags</label><input id="ed-tags" value="${esc((r.tags||[]).join(", "))}" placeholder="weeknight, mexican, soup"><small>Separate with commas.</small></div>
        <div class="f"><label for="ed-ing">Ingredients</label><textarea id="ed-ing" rows="8">${esc(r.ingredients)}</textarea><small>One per line. End a line with a colon to make a heading, like “Sauce:”.</small></div>
        <div class="f"><label for="ed-steps">Steps</label><textarea id="ed-steps" rows="8">${esc(r.steps)}</textarea><small>One step per line.</small></div>
        <div id="ed-cooked" ${status==="queue"?"hidden":""} style="display:grid;gap:14px">
          <div class="f"><label>Verdict</label><div class="seg" id="ed-v">${Object.entries(VERDICT).map(([k,[t]])=>`<button type="button" data-v="${k}" aria-pressed="${verdict===k}">${t}</button>`).join("")}</div></div>
          ${isNew?`<div class="two"><div class="f"><label for="ed-date">Last cooked</label><input id="ed-date" type="date" value="${today()}"></div><div class="f"><label for="ed-cn">Notes from that cook</label><input id="ed-cn" placeholder="Optional"></div></div>`:""}
          <div class="f"><label for="ed-chg">What I change</label><textarea id="ed-chg" rows="2" placeholder="Swaps and tweaks I always make">${esc(r.changes)}</textarea></div>
          <div class="f"><label for="ed-next">Next time</label><textarea id="ed-next" rows="2" placeholder="What I'd do differently">${esc(r.nextTime)}</textarea></div>
        </div>
        <div id="ed-queue" ${status==="queue"?"":"hidden"} class="f"><label for="ed-why">Why I want to make it</label><textarea id="ed-why" rows="2">${esc(r.why)}</textarea></div>
        <div class="status" id="ed-err"></div>
        <div class="actions"><button class="btn primary" type="submit">${isNew?"Add to box":"Save changes"}</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
      </form></div></div>`);
    document.querySelectorAll("#overlay [data-close]").forEach(b=>b.addEventListener("click",closeOverlay));
    document.querySelectorAll("#ed-status button").forEach(b=>b.onclick=()=>{ status=b.dataset.s; document.querySelectorAll("#ed-status button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); $("#ed-cooked").hidden=status==="queue"; $("#ed-queue").hidden=status!=="queue"; });
    document.querySelectorAll("#ed-v button").forEach(b=>b.onclick=()=>{ verdict = verdict===b.dataset.v?"":b.dataset.v; document.querySelectorAll("#ed-v button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.v===verdict))); });
    if(sample) $("#ed-extract").onclick=extract;
    $("#ed").onsubmit=async e=>{ e.preventDefault();
      const data={ title:$("#ed-title").value.trim(), url:$("#ed-url").value.trim(), sourceNote:$("#ed-src").value.trim(),
        time:$("#ed-time").value.trim(), servings:$("#ed-serv").value.trim(),
        tags:$("#ed-tags").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean),
        ingredients:$("#ed-ing").value.trim(), steps:$("#ed-steps").value.trim(), status,
        verdict: status==="queue"?"":verdict, changes:$("#ed-chg").value.trim(), nextTime:$("#ed-next").value.trim(), why:$("#ed-why").value.trim(),
        updatedAt:new Date().toISOString() };
      if(!data.title){ $("#ed-err").textContent="Give it a name."; return; }
      try{
        if(isNew){
          data.createdAt=new Date().toISOString(); data.plannedFor="";
          data.cooks = status==="cooked" && $("#ed-date")?.value ? [{date:$("#ed-date").value,note:$("#ed-cn").value.trim()}] : [];
          const ref=col.doc(); await ref.set(data); toast("Added!"); closeOverlay(); setView(status==="queue"?"queue":"cooked");
        } else { await col.doc(r.id).update(data); toast("Saved"); openSheet(r.id); }
      }catch(err){ $("#ed-err").textContent = err?.code==="quota_exceeded" ? "Your recipe box is full. Delete a few recipes to make room." : "Couldn't save. Check your connection and try again."; }
    };
  }

  async function extract(){
    const text=$("#ed-paste").value.trim(), xs=$("#ed-xs");
    if(!text){ xs.textContent="Paste the page text first."; return; }
    xs.textContent="Reading the page…"; $("#ed-extract").disabled=true;
    try{
      const out = await sample.json(
`Extract the recipe from the pasted web page text below. Ignore the blog story, ads, comments and nutrition panels.
Return JSON only, with these keys:
{"title": string, "time": string (total time like "45 min", or ""), "servings": string (or ""), "tags": array of 1-3 short lowercase tags (cuisine, meal type),
 "ingredients": string with one ingredient per line, keeping quantities; if the recipe has groups, put a heading line ending in ":" before each group,
 "steps": string with one concise step per line, no numbering; keep temperatures and times; headings ending in ":" allowed for groups,
 "url": the recipe's canonical URL if it appears in the text, else ""}

PAGE TEXT:
${text.slice(0,60000)}`, {modelTier:"quick"});
      const set=(id,v)=>{ if(v && !$(id).value.trim()) $(id).value=v; };
      set("#ed-title",out.title); set("#ed-time",out.time); set("#ed-serv",out.servings); set("#ed-url",out.url);
      if(out.ingredients) $("#ed-ing").value=out.ingredients;
      if(out.steps) $("#ed-steps").value=out.steps;
      if(Array.isArray(out.tags) && !$("#ed-tags").value.trim()) $("#ed-tags").value=out.tags.join(", ");
      xs.textContent="Done. Check it over, then save.";
    }catch(e){
      xs.textContent = e?.code==="not_granted" ? "Claude isn't allowed on this page. Type or paste the parts in below." : e?.code==="rate_limited" ? "Too many requests. Wait a minute and try again." : "Couldn't read that. Try pasting just the recipe section.";
    } finally { $("#ed-extract").disabled=false; }
  }

  async function save(id,patch){
    try{ await col.doc(id).update({...patch,updatedAt:new Date().toISOString()}); }
    catch(e){ toast("Couldn't save. Try again."); throw e; }
  }

  // ---------- boot ----------
  setView(ui.view==="week"?"cooked":ui.view);
  // Recipes live in recipes.json next to this page. Edit that file to update the box.
  fetch("recipes.json", {cache: "no-cache"})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(list => { recipes = list; loaded = true; banner(""); render(); })
    .catch(() => { loaded = true; banner("Your recipes couldn't load. Reload the page to try again."); render(); });
})();
</script>

</body></html>
